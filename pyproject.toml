[project]
name = "proof-of-play"
version = "0.1.0"
description = "Explainable, verified football match intelligence that measures whether its own personalisation works."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7", "numpy>=1.26"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "hypothesis>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -rs"

[tool.ruff]
line-length = 110
src = ["src"]
